<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(0, 255, 255, 0.8);
            font-size: 12px;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            pointer-events: none;
        }

        .hud-line {
            margin: 5px 0;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .hud-line:nth-child(1) { animation-delay: 0.5s; }
        .hud-line:nth-child(2) { animation-delay: 1s; }
        .hud-line:nth-child(3) { animation-delay: 1.5s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .speed {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(0, 255, 255, 0.6);
            font-size: 24px;
            z-index: 100;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            pointer-events: none;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
            opacity: 0;
            animation: titleAppear 2s ease-out 2s forwards, titleFade 2s ease-out 6s forwards;
            pointer-events: none;
        }

        .title h1 {
            font-size: 4rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(0, 255, 255, 0.6);
        }

        .title p {
            margin-top: 20px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            opacity: 0.7;
        }

        @keyframes titleAppear {
            to { opacity: 1; }
        }

        @keyframes titleFade {
            to { opacity: 0; }
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 255, 0.8);
            font-size: 16px;
            z-index: 200;
        }

        @media (max-width: 768px) {
            .title h1 { font-size: 2.5rem; }
            .hud { font-size: 10px; }
            .speed { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading" id="loading">INITIALIZING SYSTEMS...</div>

    <div class="hud">
        <div class="hud-line">▸ HYPERDRIVE: ACTIVE</div>
        <div class="hud-line">▸ SHIELDS: NOMINAL</div>
        <div class="hud-line">▸ SENSORS: ONLINE</div>
    </div>

    <div class="speed" id="speed">0.0c</div>

    <div class="title">
        <h1>DEEP SPACE</h1>
        <p>Journey Beyond The Known</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        );
        composer.addPass(bloomPass);

        // Star field
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 15000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const sizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            const i3 = i * 3;

            // Position
            positions[i3] = (Math.random() - 0.5) * 2000;
            positions[i3 + 1] = (Math.random() - 0.5) * 2000;
            positions[i3 + 2] = (Math.random() - 0.5) * 2000;

            // Color (blue-white or red-white)
            const colorChoice = Math.random();
            if (colorChoice > 0.5) {
                colors[i3] = 0.8 + Math.random() * 0.2;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 1.0;
            } else {
                colors[i3] = 1.0;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 0.8 + Math.random() * 0.2;
            }

            sizes[i] = Math.random() * 3 + 0.5;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starMaterial = new THREE.PointsMaterial({
            size: 2,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Nebula clouds
        const nebulaClouds = [];
        for (let i = 0; i < 5; i++) {
            const cloudGeometry = new THREE.SphereGeometry(100, 32, 32);
            const cloudMaterial = new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? 0x8a2be2 : 0x00bfff,
                transparent: true,
                opacity: 0.05,
                side: THREE.BackSide
            });
            const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
            cloud.position.set(
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500 - 300
            );
            nebulaClouds.push(cloud);
            scene.add(cloud);
        }

        // Asteroids
        const asteroids = [];
        const asteroidGeometry = new THREE.DodecahedronGeometry(1, 0);
        for (let i = 0; i < 100; i++) {
            const material = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.9,
                metalness: 0.1,
                emissive: 0x222222
            });
            const asteroid = new THREE.Mesh(asteroidGeometry, material);

            const scale = Math.random() * 3 + 0.5;
            asteroid.scale.set(scale, scale, scale);

            asteroid.position.set(
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 1000 - 200
            );

            asteroid.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            asteroid.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };

            asteroids.push(asteroid);
            scene.add(asteroid);
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1, 1000);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Movement variables
        let speed = 0.5;
        let targetSpeed = 0.5;
        let autoSpeed = true;
        let autoSpeedTime = 0;

        let mouseX = 0;
        let mouseY = 0;
        let targetRotationY = 0;
        let targetRotationX = 0;

        // Mouse/Touch controls
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouseX = (touch.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (touch.clientY / window.innerHeight - 0.5) * 2;

            const deltaY = touchStartY - touch.clientY;
            if (Math.abs(deltaY) > 50) {
                autoSpeed = false;
                targetSpeed = Math.max(0.1, Math.min(targetSpeed + deltaY * 0.001, 5));
                touchStartY = touch.clientY;
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                autoSpeed = false;
                targetSpeed = Math.min(targetSpeed + 0.2, 5);
            }
            if (e.key === 'ArrowDown') {
                autoSpeed = false;
                targetSpeed = Math.max(targetSpeed - 0.2, 0.1);
            }
            if (e.key === ' ') {
                autoSpeed = !autoSpeed;
            }
        });

        // Gyroscope for mobile
        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.addEventListener('touchstart', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        })
                        .catch(console.error);
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (window.innerWidth < 768) {
                mouseX = (event.gamma / 90) * 0.5;
                mouseY = ((event.beta - 45) / 90) * 0.5;
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Auto-speed variation
            if (autoSpeed) {
                autoSpeedTime += 0.003;
                const variation = Math.sin(autoSpeedTime) * 0.3;
                targetSpeed = 0.8 + variation + Math.abs(Math.sin(autoSpeedTime * 0.2)) * 0.5;
            }

            // Smooth speed transition
            speed += (targetSpeed - speed) * 0.05;

            // Camera rotation based on mouse
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.3;
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.05;

            // Move forward
            camera.position.z -= speed;

            // Stars movement
            const starPositions = stars.geometry.attributes.position.array;
            for (let i = 0; i < starPositions.length; i += 3) {
                starPositions[i + 2] += speed;

                // Reset stars that are too close
                if (starPositions[i + 2] > 500) {
                    starPositions[i + 2] = -500;
                }
            }
            stars.geometry.attributes.position.needsUpdate = true;
            stars.rotation.y += 0.0001;

            // Nebula clouds
            nebulaClouds.forEach((cloud, i) => {
                cloud.position.z += speed * 0.3;
                cloud.rotation.y += 0.001;
                cloud.rotation.x += 0.0005;

                if (cloud.position.z > 300) {
                    cloud.position.z = -500;
                }
            });

            // Asteroids
            asteroids.forEach(asteroid => {
                asteroid.position.z += speed;
                asteroid.rotation.x += asteroid.userData.rotationSpeed.x;
                asteroid.rotation.y += asteroid.userData.rotationSpeed.y;
                asteroid.rotation.z += asteroid.userData.rotationSpeed.z;

                if (asteroid.position.z > 50) {
                    asteroid.position.z = -1000;
                    asteroid.position.x = (Math.random() - 0.5) * 500;
                    asteroid.position.y = (Math.random() - 0.5) * 500;
                }
            });

            // Update HUD
            document.getElementById('speed').textContent = (speed * 2).toFixed(1) + 'c';

            composer.render();
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        document.getElementById('loading').style.display = 'none';
        animate();
    </script>
</body>
