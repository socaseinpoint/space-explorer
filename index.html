<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            font-family: 'Arial', sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        p {
            font-size: 1.5rem;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            animation: orbit 20s linear infinite;
        }

        .planet1 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c44569);
            top: 20%;
            left: 10%;
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
        }

        .planet2 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
            bottom: 20%;
            right: 15%;
            animation: orbit 30s linear infinite reverse;
            box-shadow: 0 0 60px rgba(79, 172, 254, 0.5);
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(50px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(50px) rotate(-360deg);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="planet planet1"></div>
    <div class="planet planet2"></div>

    <div class="content">
        <h1>🌌 Space Explorer</h1>
        <p>Journey through the cosmos</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Star class
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random();
                this.twinkleSpeed = Math.random() * 0.02;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Twinkle effect
                this.opacity += this.twinkleSpeed;
                if (this.opacity > 1 || this.opacity < 0.3) {
                    this.twinkleSpeed *= -1;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create stars
        const stars = [];
        for (let i = 0; i < 300; i++) {
            stars.push(new Star());
        }

        // Shooting star class
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.length = Math.random() * 80 + 20;
                this.speed = Math.random() * 10 + 5;
                this.opacity = 1;
            }

            update() {
                this.x += this.speed;
                this.y += this.speed;
                this.opacity -= 0.01;

                if (this.opacity <= 0 || this.x > canvas.width || this.y > canvas.height) {
                    if (Math.random() < 0.01) { // 1% chance to respawn
                        this.reset();
                    }
                }
            }

            draw() {
                if (this.opacity > 0) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.length, this.y - this.length);
                    ctx.stroke();
                }
            }
        }

        // Create shooting stars
        const shootingStars = [];
        for (let i = 0; i < 3; i++) {
            shootingStars.push(new ShootingStar());
        }

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(9, 10, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            shootingStars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mouse interaction
        canvas.addEventListener('mousemove', (e) => {
            const star = new Star();
            star.x = e.clientX;
            star.y = e.clientY;
            star.size = Math.random() * 3 + 1;
            stars.push(star);

            // Remove old stars
            if (stars.length > 500) {
                stars.shift();
            }
        });
    </script>
</body>
</html>
