<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            2.0, 0.3, 0.9
        );
        composer.addPass(bloomPass);

        // Motion blur by rendering semi-transparent frames
        renderer.setClearAlpha(0.85);

        // Star field
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 15000;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);
        const sizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            const i3 = i * 3;

            // Position - closer and more spread
            positions[i3] = (Math.random() - 0.5) * 1000;
            positions[i3 + 1] = (Math.random() - 0.5) * 1000;
            positions[i3 + 2] = Math.random() * 1000 - 500;

            // Color (blue-white or red-white)
            const colorChoice = Math.random();
            if (colorChoice > 0.5) {
                colors[i3] = 0.8 + Math.random() * 0.2;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 1.0;
            } else {
                colors[i3] = 1.0;
                colors[i3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i3 + 2] = 0.8 + Math.random() * 0.2;
            }

            sizes[i] = Math.random() * 5 + 1;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starMaterial = new THREE.PointsMaterial({
            size: 4,
            vertexColors: true,
            transparent: true,
            opacity: 1.0,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Nebula clouds
        const nebulaClouds = [];
        for (let i = 0; i < 5; i++) {
            const cloudGeometry = new THREE.SphereGeometry(100, 32, 32);
            const cloudMaterial = new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? 0x8a2be2 : 0x00bfff,
                transparent: true,
                opacity: 0.05,
                side: THREE.BackSide
            });
            const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
            cloud.position.set(
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500 - 300
            );
            nebulaClouds.push(cloud);
            scene.add(cloud);
        }

        // Asteroids
        const asteroids = [];
        const asteroidGeometry = new THREE.DodecahedronGeometry(1, 0);
        for (let i = 0; i < 100; i++) {
            const material = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.9,
                metalness: 0.1,
                emissive: 0x222222
            });
            const asteroid = new THREE.Mesh(asteroidGeometry, material);

            const scale = Math.random() * 3 + 0.5;
            asteroid.scale.set(scale, scale, scale);

            asteroid.position.set(
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 500,
                (Math.random() - 0.5) * 1000 - 200
            );

            asteroid.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            asteroid.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };

            asteroids.push(asteroid);
            scene.add(asteroid);
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1, 1000);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Movement variables
        let speed = 5;
        let targetSpeed = 5;
        let autoSpeed = true;
        let autoSpeedTime = 0;

        let mouseX = 0;
        let mouseY = 0;
        let targetRotationY = 0;
        let targetRotationX = 0;

        // Mouse/Touch controls
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouseX = (touch.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (touch.clientY / window.innerHeight - 0.5) * 2;

            const deltaY = touchStartY - touch.clientY;
            if (Math.abs(deltaY) > 50) {
                autoSpeed = false;
                targetSpeed = Math.max(0.1, Math.min(targetSpeed + deltaY * 0.001, 5));
                touchStartY = touch.clientY;
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                autoSpeed = false;
                targetSpeed = Math.min(targetSpeed + 0.2, 5);
            }
            if (e.key === 'ArrowDown') {
                autoSpeed = false;
                targetSpeed = Math.max(targetSpeed - 0.2, 0.1);
            }
            if (e.key === ' ') {
                autoSpeed = !autoSpeed;
            }
        });

        // Gyroscope for mobile
        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.addEventListener('touchstart', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        })
                        .catch(console.error);
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            if (window.innerWidth < 768) {
                mouseX = (event.gamma / 90) * 0.5;
                mouseY = ((event.beta - 45) / 90) * 0.5;
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Auto-speed variation
            if (autoSpeed) {
                autoSpeedTime += 0.005;
                const variation = Math.sin(autoSpeedTime) * 2;
                targetSpeed = 5 + variation + Math.abs(Math.sin(autoSpeedTime * 0.3)) * 3;
            }

            // Smooth speed transition
            speed += (targetSpeed - speed) * 0.05;

            // Camera rotation based on mouse
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.3;
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.05;
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.05;

            // Move forward
            camera.position.z -= speed;

            // Stars movement with motion streaking
            const starPositions = stars.geometry.attributes.position.array;
            const starSizes = stars.geometry.attributes.size.array;
            for (let i = 0; i < starPositions.length; i += 3) {
                starPositions[i + 2] += speed * 2;

                // Make stars stretch based on speed
                const idx = i / 3;
                starSizes[idx] = (Math.random() * 5 + 1) * (1 + speed * 0.3);

                // Reset stars that are too close
                if (starPositions[i + 2] > 200) {
                    starPositions[i + 2] = -1000;
                    starPositions[i] = (Math.random() - 0.5) * 1000;
                    starPositions[i + 1] = (Math.random() - 0.5) * 1000;
                }
            }
            stars.geometry.attributes.position.needsUpdate = true;
            stars.geometry.attributes.size.needsUpdate = true;

            // Nebula clouds
            nebulaClouds.forEach((cloud, i) => {
                cloud.position.z += speed * 0.3;
                cloud.rotation.y += 0.001;
                cloud.rotation.x += 0.0005;

                if (cloud.position.z > 300) {
                    cloud.position.z = -500;
                }
            });

            // Asteroids
            asteroids.forEach(asteroid => {
                asteroid.position.z += speed;
                asteroid.rotation.x += asteroid.userData.rotationSpeed.x;
                asteroid.rotation.y += asteroid.userData.rotationSpeed.y;
                asteroid.rotation.z += asteroid.userData.rotationSpeed.z;

                if (asteroid.position.z > 50) {
                    asteroid.position.z = -1000;
                    asteroid.position.x = (Math.random() - 0.5) * 500;
                    asteroid.position.y = (Math.random() - 0.5) * 500;
                }
            });

            composer.render();
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
    </script>
</body>
