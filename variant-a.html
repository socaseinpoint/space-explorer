<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Tunnel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);

        const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 0;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            3.0, 0.5, 0.1
        );
        composer.addPass(bloomPass);

        // Neon tunnel rings
        const rings = [];
        for (let i = 0; i < 50; i++) {
            const geometry = new THREE.TorusGeometry(15, 0.3, 16, 100);
            const hue = (i * 0.05) % 1;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 2
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.position.z = -i * 20;
            ring.userData.hue = hue;
            rings.push(ring);
            scene.add(ring);
        }

        // Neon particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const angle = Math.random() * Math.PI * 2;
            const radius = 5 + Math.random() * 20;
            positions[i3] = Math.cos(angle) * radius;
            positions[i3 + 1] = Math.sin(angle) * radius;
            positions[i3 + 2] = Math.random() * -1000;

            const hue = Math.random();
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 3,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Grid floor
        const gridSize = 100;
        const gridDivisions = 50;
        const gridGeometry = new THREE.BufferGeometry();
        const gridPositions = [];
        const gridColors = [];

        for (let i = 0; i <= gridDivisions; i++) {
            const x = (i / gridDivisions - 0.5) * gridSize;
            gridPositions.push(x, -15, -500, x, -15, 0);
            const color = new THREE.Color(0x00ffff);
            gridColors.push(color.r, color.g, color.b, color.r, color.g, color.b);
        }
        for (let i = 0; i <= gridDivisions; i++) {
            const z = -i * (500 / gridDivisions);
            gridPositions.push(-gridSize/2, -15, z, gridSize/2, -15, z);
            const color = new THREE.Color(0xff00ff);
            gridColors.push(color.r, color.g, color.b, color.r, color.g, color.b);
        }

        gridGeometry.setAttribute('position', new THREE.Float32BufferAttribute(gridPositions, 3));
        gridGeometry.setAttribute('color', new THREE.Float32BufferAttribute(gridColors, 3));

        const gridMaterial = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const grid = new THREE.LineSegments(gridGeometry, gridMaterial);
        scene.add(grid);

        let speed = 15;
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Move rings
            rings.forEach((ring, i) => {
                ring.position.z += speed;
                ring.rotation.z = time * 0.5 + i * 0.1;

                // Color cycle
                const hue = (ring.userData.hue + time * 0.1) % 1;
                const color = new THREE.Color().setHSL(hue, 1, 0.5);
                ring.material.color = color;
                ring.material.emissive = color;

                if (ring.position.z > 20) {
                    ring.position.z = -980;
                }
            });

            // Move particles
            const particlePositions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particlePositions.length; i += 3) {
                particlePositions[i + 2] += speed * 2;
                if (particlePositions[i + 2] > 20) {
                    particlePositions[i + 2] = -1000;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.z = time * 0.1;

            // Move grid
            grid.position.z = (time * speed * 2) % 10;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
