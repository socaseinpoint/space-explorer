<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormhole</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            2.5, 0.4, 0.85
        );
        composer.addPass(bloomPass);

        // Wormhole tunnel with distortion
        const tunnelSegments = [];
        for (let i = 0; i < 100; i++) {
            const geometry = new THREE.TorusGeometry(5 + i * 0.3, 0.5, 16, 100);
            const material = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.6 + i * 0.003, 0.8, 0.6),
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            const segment = new THREE.Mesh(geometry, material);
            segment.position.z = -i * 5;
            segment.userData.baseRadius = 5 + i * 0.3;
            segment.userData.offset = i * 0.1;
            tunnelSegments.push(segment);
            scene.add(segment);
        }

        // Energy particles
        const energyGeometry = new THREE.BufferGeometry();
        const energyCount = 10000;
        const energyPositions = new Float32Array(energyCount * 3);
        const energyColors = new Float32Array(energyCount * 3);
        const energySizes = new Float32Array(energyCount);

        for (let i = 0; i < energyCount; i++) {
            const i3 = i * 3;
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 50;
            const spiralFactor = Math.random() * 20;

            energyPositions[i3] = Math.cos(angle + spiralFactor) * radius;
            energyPositions[i3 + 1] = Math.sin(angle + spiralFactor) * radius;
            energyPositions[i3 + 2] = Math.random() * -500;

            const hue = 0.5 + Math.random() * 0.3;
            const color = new THREE.Color().setHSL(hue, 1, 0.7);
            energyColors[i3] = color.r;
            energyColors[i3 + 1] = color.g;
            energyColors[i3 + 2] = color.b;

            energySizes[i] = Math.random() * 4 + 1;
        }

        energyGeometry.setAttribute('position', new THREE.BufferAttribute(energyPositions, 3));
        energyGeometry.setAttribute('color', new THREE.BufferAttribute(energyColors, 3));
        energyGeometry.setAttribute('size', new THREE.BufferAttribute(energySizes, 1));

        const energyMaterial = new THREE.PointsMaterial({
            size: 3,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending
        });

        const energy = new THREE.Points(energyGeometry, energyMaterial);
        scene.add(energy);

        // Light rays
        const rayGeometry = new THREE.BufferGeometry();
        const rayCount = 200;
        const rayPositions = [];
        const rayColors = [];

        for (let i = 0; i < rayCount; i++) {
            const angle = (i / rayCount) * Math.PI * 2;
            const radius = 50;
            rayPositions.push(0, 0, -500);
            rayPositions.push(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);

            const color = new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 1, 0.6);
            rayColors.push(color.r, color.g, color.b);
            rayColors.push(color.r, color.g, color.b);
        }

        rayGeometry.setAttribute('position', new THREE.Float32BufferAttribute(rayPositions, 3));
        rayGeometry.setAttribute('color', new THREE.Float32BufferAttribute(rayColors, 3));

        const rayMaterial = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });

        const rays = new THREE.LineSegments(rayGeometry, rayMaterial);
        scene.add(rays);

        let time = 0;
        const speed = 8;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Distort tunnel
            tunnelSegments.forEach((segment, i) => {
                segment.position.z += speed;

                // Wormhole distortion effect
                const distortion = Math.sin(time * 2 + segment.userData.offset) * 2;
                segment.scale.x = 1 + distortion * 0.2;
                segment.scale.y = 1 + distortion * 0.2;
                segment.rotation.z = time * 0.5 + i * 0.05;

                // Color shift
                const hue = (0.6 + time * 0.1 + i * 0.003) % 1;
                segment.material.color.setHSL(hue, 0.8, 0.6);

                if (segment.position.z > 10) {
                    segment.position.z = -490;
                }
            });

            // Spiral energy particles
            const energyPositions = energy.geometry.attributes.position.array;
            for (let i = 0; i < energyPositions.length; i += 3) {
                energyPositions[i + 2] += speed * 1.5;

                // Spiral motion
                const angle = time * 2 + i * 0.01;
                const radius = Math.sqrt(energyPositions[i] ** 2 + energyPositions[i + 1] ** 2);
                energyPositions[i] = Math.cos(angle) * radius;
                energyPositions[i + 1] = Math.sin(angle) * radius;

                if (energyPositions[i + 2] > 10) {
                    energyPositions[i + 2] = -500;
                }
            }
            energy.geometry.attributes.position.needsUpdate = true;

            // Rotate rays
            rays.rotation.z = time * 0.3;

            // Camera pulse
            camera.position.z = 5 + Math.sin(time * 3) * 0.5;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
