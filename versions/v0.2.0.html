<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create stars with motion trails
        const starCount = 1000;
        const stars = [];

        for (let i = 0; i < starCount; i++) {
            // Random position in a cylinder around camera path
            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 40;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            const z = -Math.random() * 200 - 50; // Stars are ahead of us

            // Star point
            const starGeometry = new THREE.SphereGeometry(0.05, 4, 4);
            const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set(x, y, z);
            scene.add(star);

            // Motion trail line
            const trailGeometry = new THREE.BufferGeometry();
            const trailPositions = new Float32Array([
                x, y, z,
                x, y, z + 5
            ]);
            trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));

            const trailMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3
            });
            const trail = new THREE.Line(trailGeometry, trailMaterial);
            scene.add(trail);

            stars.push({ star, trail, x, y });
        }

        // Animation
        const speed = 2;

        function animate() {
            requestAnimationFrame(animate);

            // Move stars towards camera (they pass by us)
            stars.forEach(({ star, trail, x, y }) => {
                star.position.z += speed;

                // Update trail
                const trailPositions = trail.geometry.attributes.position.array;
                trailPositions[2] = star.position.z; // Start of trail
                trailPositions[5] = star.position.z + 5; // End of trail (behind the star)
                trail.geometry.attributes.position.needsUpdate = true;

                // Reset star when it passes camera
                if (star.position.z > 10) {
                    star.position.z = -250;
                    star.position.x = x;
                    star.position.y = y;
                }
            });

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
